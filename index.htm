
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Candy Crusher</title>
  <link href="./styles.css" rel="stylesheet" />
  <script>
document.addEventListener("DOMContentLoaded", () => {
  const grid = document.querySelector(".grid");
  const scoreDisplay = document.getElementById("score");
  const width = 8;
  const squares = [];
  let score = 0;

  const candyColours = [
    "url(images/red.png)",
    "url(images/yellow.png)",
    "url(images/orange.png)",
    "url(images/purple.png)",
    "url(images/green.png)",
    "url(images/blue.png)"
  ];

  // Create board
  function createBoard() {
    for (let i = 0; i < width ** 2; i++) {
      let randomColour = Math.floor(Math.random() * candyColours.length);
      const square = document.createElement("div");
      square.setAttribute("draggable", true);
      square.setAttribute("id", i);
      square.style.backgroundImage = candyColours[randomColour];

      grid.appendChild(square);
      squares.push(square);
    }
  }

  createBoard();

  // Drag candies
  let colourBeingDragged;
  let squareIdBeingDragged;
  let colourBeingReplaced;
  let squareIdBeingReplaced;

  squares.forEach(square => square.addEventListener("dragstart", dragStart));
  squares.forEach(square => square.addEventListener("dragend", dragEnd));
  squares.forEach(square => square.addEventListener("dragover", dragOver));
  squares.forEach(square => square.addEventListener("dragenter", dragEnter));
  squares.forEach(square => square.addEventListener("dragleave", dragLeave));
  squares.forEach(square => square.addEventListener("drop", dragDrop));

  function dragStart() {
    colourBeingDragged = this.style.backgroundImage;
    squareIdBeingDragged = parseInt(this.id);
  };

  function dragEnd() {
    // What is a valid move?
    let validMoves = [
      squareIdBeingDragged - 1,
      squareIdBeingDragged - width,
      squareIdBeingDragged + 1,
      squareIdBeingDragged + width
    ];

    let validMove = validMoves.includes(squareIdBeingReplaced);

    if (squareIdBeingReplaced && validMove) {
      squareIdBeingReplaced = null;
    } else if (squareIdBeingReplaced && !validMove) {
        squares[squareIdBeingReplaced].style.backgroundImage = colourBeingReplaced;
        squares[squareIdBeingDragged].style.backgroundImage = colourBeingDragged;
    } else {
        squares[squareIdBeingDragged].style.backgroundImage = colourBeingDragged;
    }
  };

  // drop candies
  function moveDown() {
    for (let i = 0; i < 55; i++){
      if (squares[i + width].style.backgroundImage === "") {
        squares[i + width].style.backgroundImage = squares[i].style.backgroundImage;
        squares[i].style.backgroundImage = "";

        const firstRow = [0, 1, 2, 3, 4, 5, 6, 7];
        const isFirstRow = firstRow.includes(i);

        if (isFirstRow && squares[i].style.backgroundImage === "") {
          let randomColour =  Math.floor(Math.random() * candyColours.length);
          squares[i].style.backgroundImage = candyColours[randomColour];
        }
      }
    }
  }

  function dragOver(e) {
    e.preventDefault();
  };


  function dragEnter(e) {
    e.preventDefault();
  };

  function dragLeave() {};

  function dragDrop() {
    colourBeingReplaced = this.style.backgroundImage;
    squareIdBeingReplaced = parseInt(this.id);
    this.style.backgroundImage = colourBeingDragged;
    squares[squareIdBeingDragged].style.backgroundImage = colourBeingReplaced;
  };

  // Check for matches
  // check for row of three
  function checkRowForThree() {
    for (let i = 0; i < 61; i++) {
      let rowOfThree = [i, i + 1, i + 2];
      let decidedColour = squares[i].style.backgroundImage;
      const isBlank = squares[i].style.backgroundImage === "";
      const notValid = [6, 7, 14, 15, 22, 23, 30, 31, 38, 39, 46, 47, 54, 55];

      if (notValid.includes(i)) {
        continue;
      }

      if (rowOfThree.every(index => squares[index].style.backgroundImage === decidedColour && !isBlank)) {
        score += 3;
        scoreDisplay.innerHTML = score;

        rowOfThree.forEach(index => {
          squares[index].style.backgroundImage = "";
        });
      }
    }
  }

  checkRowForThree();

  // check for column of three
  function checkColumnForThree() {
    for (let i = 0; i < 47; i++) {
      let columnOfThree = [i, i + width, i + width * 2];

    }
  }

});
  </script>
</head>

<body>

  <div class="grid"></div>
  <div class="score-board">
    <h1 id="score"></h1>
  </div>

</body>
</html>
